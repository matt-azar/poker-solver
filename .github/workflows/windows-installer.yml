# Windows NSIS installer for Hold'em Study (Tauri + Zig solver-engine sidecar).
#
# Prerequisites (not owned by this workflow):
# - desktop/package.json must define "tauri": "tauri" and depend on @tauri-apps/cli
# - desktop/src-tauri must be configured for an externalBin sidecar named "solver-engine"
# - No code signing is required or performed
#
# Artifact: holdem-study-windows-installer (NSIS *.exe under bundle/nsis)
#
# Release channel (intentional tags only — not every main merge):
# - Push tag v*-windows (e.g. v0.1.1-windows) → windows-installer-release.yml
#   builds and attaches the installer to a GitHub Release.
# - Stable download name: Holdem-Study-windows-x64-setup.exe
#   (README /releases/latest/download/… stays current across cuts)
# - Path-filtered main / zig-rewrite / PR pushes below only upload the Actions artifact.

name: Windows Installer

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main, zig-rewrite]
    paths:
      - "desktop/**"
      - "configs/**"
      - "build.zig"
      - "build.zig.zon"
      - "engine/**"
      - "app/**"
      - "formats/**"
      - "host/**"
      - "cli/**"
      - "scripts/zig/**"
      - ".github/workflows/windows-installer.yml"
      - ".github/workflows/windows-installer-release.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "configs/**"
      - "build.zig"
      - "build.zig.zon"
      - "engine/**"
      - "app/**"
      - "formats/**"
      - "host/**"
      - "cli/**"
      - "scripts/zig/**"
      - ".github/workflows/windows-installer.yml"
      - ".github/workflows/windows-installer-release.yml"

concurrency:
  group: windows-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # Stable asset name for releases/latest/download/…
  STABLE_INSTALLER_NAME: Holdem-Study-windows-x64-setup.exe

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    # Tag publishes (via workflow_call) need contents:write; artifact uploads do not.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          shared-key: windows-installer

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Shipping Study sidecar is Zig solver-engine (owner GO 2026-11-12).
      # Zig pin matches .github/workflows/zig.yml.
      - name: Install Zig 0.14.1
        shell: pwsh
        env:
          ZIG_VERSION: "0.14.1"
          ZIG_WINDOWS_SHA256: "554f5378228923ffd558eac35e21af020c73789d87afeabf4bfd16f2e6feed2c"
        run: |
          $ErrorActionPreference = "Stop"
          $ver = $env:ZIG_VERSION
          $zip = "$env:RUNNER_TEMP\zig.zip"
          $url = "https://ziglang.org/download/$ver/zig-x86_64-windows-$ver.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          $expected = $env:ZIG_WINDOWS_SHA256.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Zig zip sha256 mismatch: got $actual want $expected"
          }
          $dest = Join-Path $env:LOCALAPPDATA "zig-$ver"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Expand-Archive -Path $zip -DestinationPath $dest
          Add-Content $env:GITHUB_PATH (Join-Path $dest "zig-x86_64-windows-$ver")

      - name: Build solver-engine (ReleaseFast)
        shell: pwsh
        run: |
          zig version
          # Portable Windows floor (no AVX-512); see zig.yml Windows note.
          zig build -Doptimize=ReleaseFast -Dcpu=x86_64_v2
          if (-not (Test-Path "zig-out/bin/solver-engine.exe")) {
            throw "solver-engine.exe missing after zig build"
          }
          # ZR-97/ZR-106: packaged Study must ship a GUI-subsystem sidecar so a
          # blank console cannot appear (closing it kills IPC).
          python scripts/zig/check-pe-subsystem.py zig-out/bin/solver-engine.exe --expect 2

      - name: Install desktop npm dependencies
        working-directory: desktop
        run: npm ci

      # Unit suite lives in CI's path-gated `desktop` job (ci.yml), not here —
      # this workflow already pays for Zig + Tauri NSIS and keeps the
      # installer path focused on packaging.
      - name: Build desktop UI
        working-directory: desktop
        run: npm run build

      - name: Prepare solver-engine sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/binaries | Out-Null
          $hostTriple = (rustc -vV | Select-String "host:").ToString().Split()[1]
          Write-Host "rustc host triple: $hostTriple"
          # Expected on windows-latest: x86_64-pc-windows-msvc
          Copy-Item -Force zig-out/bin/solver-engine.exe `
            "desktop/src-tauri/binaries/solver-engine-x86_64-pc-windows-msvc.exe"
          Get-Item "desktop/src-tauri/binaries/solver-engine-x86_64-pc-windows-msvc.exe" |
            Format-List FullName, Length, LastWriteTime

      - name: Build Tauri NSIS installer
        # Requires package.json script: "tauri": "tauri" (with @tauri-apps/cli installed).
        # NSIS POSTINSTALL verifies solver-engine.exe and Unblock-Files the engine+UI.
        working-directory: desktop
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: npm run tauri build

      - name: Verify release payload includes sidecar and Library assets
        shell: pwsh
        run: |
          $zigEngine = Get-ChildItem -Recurse desktop/src-tauri/target/release `
            -Filter "solver-engine*.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 5 FullName, Length
          $zigEngine | Format-Table -AutoSize
          if (-not $zigEngine) {
            throw "solver-engine sidecar missing from Tauri release output (externalBin)"
          }

          $legacy = Get-ChildItem -Recurse desktop/src-tauri/target/release `
            -Filter "holdem-explorer*.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 3 FullName, Length
          if ($legacy) {
            $legacy | Format-Table -AutoSize
            throw "holdem-explorer must not ship in the stable Zig installer payload"
          }

          $releaseRoot = "desktop/src-tauri/target/release"
          $requiredTemplates = @(
            "flop-check-down.txt",
            "flop-small-bet.txt",
            "turn-probe.txt"
          )
          $requiredRanges = @(
            "broadway.txt",
            "value-heavy.txt",
            (Join-Path "open" "utg-open.txt")
          )

          function Find-ResourceFile([string]$LeafPath) {
            $matches = Get-ChildItem -Recurse $releaseRoot -File -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -replace '\\','/' -like "*/configs/$($LeafPath -replace '\\','/')"
              }
            return $matches | Select-Object -First 1
          }

          foreach ($name in $requiredTemplates) {
            $hit = Find-ResourceFile ("templates/" + $name)
            if (-not $hit) {
              throw "bundled template missing from Tauri release output: configs/templates/$name"
            }
            Write-Host "template: $($hit.FullName)"
          }
          foreach ($name in $requiredRanges) {
            $hit = Find-ResourceFile ("ranges/" + ($name -replace '\\','/'))
            if (-not $hit) {
              throw "bundled range missing from Tauri release output: configs/ranges/$name"
            }
            Write-Host "range: $($hit.FullName)"
          }

          $nsis = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter "*.exe" `
            -ErrorAction SilentlyContinue
          if (-not $nsis) {
            throw "NSIS installer exe missing under bundle/nsis"
          }
          Write-Host "NSIS installer(s):"
          $nsis | Format-Table FullName, Length -AutoSize

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: holdem-study-windows-installer
          # productName is "Holdem Study" (no apostrophe) — NSIS rejects Hold'em in shortcuts.
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/**/*.exe
          if-no-files-found: error

      - name: Stage GitHub Release assets
        # Only when invoked for a v*-windows tag (release wrapper or direct tag ref).
        if: github.ref_type == 'tag' && endsWith(github.ref_name, '-windows')
        shell: pwsh
        run: |
          $nsis = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter "*.exe" |
            Select-Object -First 1
          if (-not $nsis) {
            throw "No NSIS exe to stage for GitHub Release"
          }
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item -Force $nsis.FullName "release-assets/$($nsis.Name)"
          Copy-Item -Force $nsis.FullName "release-assets/$env:STABLE_INSTALLER_NAME"
          Get-ChildItem release-assets | Format-Table Name, Length -AutoSize

      - name: Publish GitHub Release
        # Intentional v*-windows tags only. Never on main merge / PR.
        if: github.ref_type == 'tag' && endsWith(github.ref_name, '-windows')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Unsigned Windows NSIS installer for Holdem Study.

            - Installs for the current user
            - Starts the Zig solver-engine sidecar (typed IPC) and opens the Study UI
            - No CMake or npm required
            - Windows SmartScreen may warn because the binary is not code-signed — More info → Run anyway
            - WebView2 may install on first launch if missing

            Stable download (README): `${{ env.STABLE_INSTALLER_NAME }}`
            via https://github.com/${{ github.repository }}/releases/latest/download/${{ env.STABLE_INSTALLER_NAME }}

      - name: List bundle outputs (diagnostics)
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse desktop/src-tauri/target/release/bundle -ErrorAction SilentlyContinue |
            Select-Object FullName, Length
