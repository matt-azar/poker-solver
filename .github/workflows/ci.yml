name: CI

# push only on main + pull_request avoids duplicate runs on the same PR head.
# workflow_dispatch re-runs both path gates (C++ and desktop) on demand.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  # Path gate: skip the C++ matrix for docs/UI-only changes and skip the
  # desktop suite when desktop/** is untouched, while still reporting a
  # terminal `ci` check (see aggregate job below).
  changes:
    runs-on: ubuntu-latest
    # paths-filter lists PR files via the GitHub API; restricted default
    # GITHUB_TOKEN scopes omit pull-requests and fail with
    # "Resource not accessible by integration".
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.gate.outputs.code }}
      desktop: ${{ steps.gate.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            code:
              - 'src/**'
              - 'include/**'
              - 'tests/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'benchmarks/**'
              - 'legacy/ui/**'
              - 'configs/**'
              - '.github/workflows/ci.yml'
            desktop:
              - 'desktop/**'
              - 'configs/range-profiles/**'
              - 'docs/ai-context/**'
              - 'docs/STUDY_SETUP_ASSISTANT.md'
              - '.github/workflows/ci.yml'
      # workflow_dispatch has no useful changed-files base; force both gates on.
      - id: gate
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=${{ steps.filter.outputs.code }}" >> "$GITHUB_OUTPUT"
            echo "desktop=${{ steps.filter.outputs.desktop }}" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Configure
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DPOKER_SOLVER_BUILD_BENCHMARKS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - name: Build
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: >
          cmake --build build --config Release --parallel
          --target river_solver
          --target street_solver --target explorer --target equity_calculator
          --target poker_solver_tests --target poker_engine_tests
          --target poker_study_tests --target poker_http_tests
          --target equity_tests --target equity_calculator_tests
          --target street_memory_bench --target street_betting_bench
          --target street_parallel_bench
      - name: CTest
        run: ctest --test-dir build -C Release --output-on-failure
      - name: JavaScript
        run: node tests/legacy_ui/browse.test.js

  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-release
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DPOKER_SOLVER_BUILD_BENCHMARKS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: >
          cmake --build build --parallel
          --target river_solver
          --target street_solver --target explorer --target equity_calculator
          --target poker_solver_tests --target poker_engine_tests
          --target poker_study_tests --target poker_http_tests
          --target equity_tests --target equity_calculator_tests
          --target street_memory_bench --target street_betting_bench
          --target street_parallel_bench
      - name: CTest
        run: ctest --test-dir build --output-on-failure
      - name: JavaScript
        run: node tests/legacy_ui/browse.test.js

  # Sanitizer: main + non-draft PRs only; waits for linux Release to fail fast.
  linux-sanitizer:
    needs: [changes, linux]
    if: |
      always()
      && needs.changes.outputs.code == 'true'
      && needs.linux.result == 'success'
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-sanitizer
      - name: Configure
        run: |
          cmake -S . -B build-san -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: >
          cmake --build build-san --parallel
          --target poker_solver_tests --target poker_engine_tests
          --target poker_study_tests --target poker_http_tests
          --target equity_tests --target equity_calculator_tests
          --target equity_calculator
      - name: CTest
        run: ctest --test-dir build-san --output-on-failure

  # Desktop (Tauri UI) unit suite — independent of the C++ matrix so
  # desktop-only PRs can go green without a full solver rebuild.
  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        run: npm ci
      - name: Forbid duplicated range assets
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for d in desktop/src/domain/profiles/fixtures desktop/src/domain/profiles/packs; do
            if [[ -e "$d" ]]; then
              echo "Duplicate range assets under $d — import from configs/range-profiles instead" >&2
              exit 1
            fi
          done
      - name: Check AI context packs
        working-directory: ${{ github.workspace }}
        run: node desktop/scripts/sync-ai-context-packs.mjs --check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # Single status for branch protection: green on docs-only skips and when
  # the gated matrices (C++ and/or desktop) that ran succeed.
  ci:
    needs: [changes, windows, linux, linux-sanitizer, desktop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate matrix
        run: |
          set -euo pipefail
          echo "changes=${{ needs.changes.result }}"
          echo "code=${{ needs.changes.outputs.code }}"
          echo "desktop=${{ needs.changes.outputs.desktop }}"
          echo "windows=${{ needs.windows.result }}"
          echo "linux=${{ needs.linux.result }}"
          echo "sanitizer=${{ needs.linux-sanitizer.result }}"
          echo "desktop_job=${{ needs.desktop.result }}"
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Path gate (changes) did not succeed" >&2
            exit 1
          fi
          code="${{ needs.changes.outputs.code }}"
          desk="${{ needs.changes.outputs.desktop }}"
          if [[ "$code" != "true" && "$desk" != "true" ]]; then
            echo "Docs/UI-only change; C++ and desktop matrices skipped"
            exit 0
          fi
          if [[ "$code" == "true" ]]; then
            [[ "${{ needs.windows.result }}" == "success" ]]
            [[ "${{ needs.linux.result }}" == "success" ]]
            # Draft PRs may skip the sanitizer; ready/push/dispatch require success.
            if [[ "${{ github.event.pull_request.draft }}" == "true" ]]; then
              case "${{ needs.linux-sanitizer.result }}" in
                success|skipped) ;;
                *) exit 1 ;;
              esac
            else
              [[ "${{ needs.linux-sanitizer.result }}" == "success" ]]
            fi
          fi
          if [[ "$desk" == "true" ]]; then
            [[ "${{ needs.desktop.result }}" == "success" ]]
          fi
