# Windows NSIS installer for Hold'em Study (Tauri + explorer sidecar).
#
# Prerequisites (not owned by this workflow):
# - desktop/package.json must define "tauri": "tauri" and depend on @tauri-apps/cli
# - desktop/src-tauri must be configured for an externalBin sidecar named "holdem-explorer"
# - No code signing is required or performed
#
# Artifact: holdem-study-windows-installer (NSIS *.exe under bundle/nsis)

name: Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "src/explorer_main.cpp"
      - ".github/workflows/windows-installer.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "src/explorer_main.cpp"
      - ".github/workflows/windows-installer.yml"

concurrency:
  group: windows-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          shared-key: windows-installer

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure CMake (Release, static MSVC CRT)
        # Static CRT so the shipped holdem-explorer sidecar does not depend on a
        # separate Visual C++ Redistributable on the end-user machine.
        # Keep the runner's default generator (do not force VS 17 — not always present).
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DCMAKE_POLICY_DEFAULT_CMP0091=NEW
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build explorer (Release)
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: cmake --build build --config Release --parallel --target explorer

      - name: Install desktop npm dependencies
        working-directory: desktop
        run: npm ci

      - name: Build desktop UI
        working-directory: desktop
        run: npm run build

      - name: Prepare explorer sidecar binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/binaries | Out-Null
          $hostTriple = (rustc -vV | Select-String "host:").ToString().Split()[1]
          Write-Host "rustc host triple: $hostTriple"
          # Expected on windows-latest: x86_64-pc-windows-msvc
          # Sidecar basename is holdem-explorer (not explorer) to avoid Windows Shell collisions.
          Copy-Item -Force build/Release/explorer.exe `
            "desktop/src-tauri/binaries/holdem-explorer-x86_64-pc-windows-msvc.exe"
          Get-Item "desktop/src-tauri/binaries/holdem-explorer-x86_64-pc-windows-msvc.exe" |
            Format-List FullName, Length, LastWriteTime

      - name: Build Tauri NSIS installer
        # Requires package.json script: "tauri": "tauri" (with @tauri-apps/cli installed).
        # NSIS POSTINSTALL verifies holdem-explorer.exe and Unblock-Files the engine+UI.
        working-directory: desktop
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: npm run tauri build

      - name: Verify release payload includes holdem-explorer sidecar
        shell: pwsh
        run: |
          $sidecar = Get-ChildItem -Recurse desktop/src-tauri/target/release `
            -Filter "holdem-explorer*.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 5 FullName, Length
          $sidecar | Format-Table -AutoSize
          if (-not $sidecar) {
            throw "holdem-explorer sidecar missing from Tauri release output"
          }
          $nsis = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter "*.exe" `
            -ErrorAction SilentlyContinue
          if (-not $nsis) {
            throw "NSIS installer exe missing under bundle/nsis"
          }
          Write-Host "NSIS installer(s):"
          $nsis | Format-Table FullName, Length -AutoSize

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: holdem-study-windows-installer
          # productName is "Holdem Study" (no apostrophe) — NSIS rejects Hold'em in shortcuts.
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/**/*.exe
          if-no-files-found: error

      - name: List bundle outputs (diagnostics)
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse desktop/src-tauri/target/release/bundle -ErrorAction SilentlyContinue |
            Select-Object FullName, Length
