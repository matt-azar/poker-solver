name: CI

# Desktop Study UI gate. Zig build/test lives in zig.yml; Windows NSIS in
# windows-installer.yml. C++ / holdem-explorer matrices were removed on main
# (owner GO 2026-11-12 — full Zig, no C++ shipping path).
on:
  push:
    branches: [main, zig-rewrite]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      desktop: ${{ steps.gate.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            desktop:
              - 'desktop/**'
              - 'configs/range-profiles/**'
              - 'configs/templates/**'
              - 'configs/ranges/**'
              - 'docs/ai-context/**'
              - 'docs/STUDY_SETUP_ASSISTANT.md'
              - '.github/workflows/ci.yml'
      - id: gate
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=${{ steps.filter.outputs.desktop }}" >> "$GITHUB_OUTPUT"
          fi

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        run: npm ci
      - name: Forbid duplicated range assets
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for d in desktop/src/domain/profiles/fixtures desktop/src/domain/profiles/packs; do
            if [[ -e "$d" ]]; then
              echo "Duplicate range assets under $d — import from configs/range-profiles instead" >&2
              exit 1
            fi
          done
      - name: Check AI context packs
        working-directory: ${{ github.workspace }}
        run: node desktop/scripts/sync-ai-context-packs.mjs --check
      - name: Validate Library catalogue assets
        working-directory: ${{ github.workspace }}
        run: node desktop/scripts/validate-library-assets.mjs
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # Single status for branch protection: green on docs-only skips and when
  # the desktop matrix that ran succeeds.
  ci:
    needs: [changes, desktop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate matrix
        run: |
          set -euo pipefail
          echo "changes=${{ needs.changes.result }}"
          echo "desktop=${{ needs.changes.outputs.desktop }}"
          echo "desktop_job=${{ needs.desktop.result }}"
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Path gate (changes) did not succeed" >&2
            exit 1
          fi
          desk="${{ needs.changes.outputs.desktop }}"
          if [[ "$desk" != "true" ]]; then
            echo "Docs/engine-only change; desktop matrix skipped (see zig.yml for Zig)"
            exit 0
          fi
          [[ "${{ needs.desktop.result }}" == "success" ]]
